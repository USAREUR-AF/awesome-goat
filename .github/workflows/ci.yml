name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: finds links that stopped loading.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    name: list format and links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: entry format, sections, duplicates
        run: python3 tools/check.py
      - name: every link loads
        run: python3 tools/check.py --links
